[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlitedb"
version = "0.3.1"
description = "A minimal in-memory relational database with a SQL engine, B-tree index and WAL-style transactions."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "zhiyayi" }]
keywords = ["database", "sql", "relational", "btree", "wal"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Database",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "mypy"]
test = ["pytest>=7", "pytest-cov>=4"]

[project.scripts]
sqlitedb = "sqlitedb.cli:main"

[tool.setuptools.packages.find]
include = ["sqlitedb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["sqlitedb"]
omit = ["*/cli.py", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
